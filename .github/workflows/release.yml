name: Release

# This repository is a mirror: its contents are pushed by the release pipeline
# in Routebase's own repository (`cli-release.yml`), which also pushes the
# `v<version>` tag. That tag push triggers this workflow, which turns it into a
# GitHub release so the published versions are visible here.
#
# Do not edit this file directly — it is written from
# `src/backend/Routebase.Mcp.Cli/mirror/.github/workflows/release.yml` upstream.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub release for the tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "\`routebase-mcp\` $GITHUB_REF_NAME is on npm: https://www.npmjs.com/package/routebase-mcp/v/$VERSION

          Install it with \`npx routebase-mcp\`, or read the [MCP quickstart](https://docs.routebase.dev/mcp-quickstart/). The binaries this version pins are listed in \`checksums.json\` and served from https://releases.routebase.dev/cli/$VERSION/.

          This repository mirrors the connector as published. See the [release notes](https://docs.routebase.dev/release-notes/) for what changed."
